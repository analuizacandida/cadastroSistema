<div fxLayout="row" fxLayoutAlign="center">
  <div fxFlex="1000px">
    <form class="form-container" #clientesFrm="ngForm" (ngSubmit)="salvar()">
      <mat-card>
        <mat-card-header>
          <mat-card-title>Dados Pessoais</mat-card-title>
        </mat-card-header>

        <mat-card-content>
          <div fxLayout="row wrap" fxLayoutGap="16px">
            <!-- Nome -->
            <mat-form-field class="full-width" appearance="outline">
              <mat-label>Nome completo</mat-label>
              <input
                matInput
                type="text"
                name="nome"
                [(ngModel)] = "cliente.nome"
                placeholder="Digite seu nome"
                required
              />
              <mat-icon matSuffix>person</mat-icon>
              <mat-hint>Ex: Ana Carvalho</mat-hint>
            </mat-form-field>

            <!-- CPF -->
            <mat-form-field class="full-width" appearance="outline">
              <mat-label>CPF</mat-label>
              <input
                matInput
                type="text"
                name="cpf"
                [(ngModel)] = "cliente.cpf"
                placeholder="000.000.000-00"
                required
              />
              <mat-icon matSuffix>badge</mat-icon>
            </mat-form-field>

            <!-- Data de Nascimento -->
            <mat-form-field class="full-width" appearance="outline">
              <mat-label>Data de Nascimento</mat-label>
              <input
                matInput
                [matDatepicker]="picker"
                name="dataNascimento"
                [(ngModel)] = "cliente.dataNascimento"
                placeholder="DD/MM/AAAA"
                required
              />
              <mat-datepicker-toggle
                matSuffix
                [for]="picker"
              ></mat-datepicker-toggle>
              <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>

            <!-- Email -->
            <mat-form-field class="full-width" appearance="outline">
              <mat-label>Email</mat-label>
              <input
                matInput
                type="email"
                name="email"
                [(ngModel)] = "cliente.email"
                placeholder="exemplo@email.com"
                required
              />
              <mat-icon matSuffix>email</mat-icon>
            </mat-form-field>
          </div>
        </mat-card-content>

        <mat-card-actions>
          <button
            mat-flat-button
            color="primary"
            [disabled]="clientesFrm.invalid"
            class="ml-5"
            type="submit"

          >
            <mat-icon>save</mat-icon>
            Salvar
          </button>
          <button
            mat-flat-button
            color="accent"
            [disabled]="clientesFrm.invalid"
            class="ml-5"
          >
            <mat-icon>refresh</mat-icon>
            Atualizar
          </button>
          <button
            mat-flat-button
            color="accent"
            [disabled]="clientesFrm.invalid"
            class="ml-5 "
          >
            <mat-icon>backspace</mat-icon>
            Limpar
          </button>
        </mat-card-actions>
      </mat-card>
    </form>
  </div>
</div>
